[profile.default]
src = "src"
out = "out"
libs = ["node_modules", "lib"]
test = "test"
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
via_ir = true
optimizer_runs = 1000
# test/DarkGrumpkin.t.sol checks the curve library against @noble/curves through node.
ffi = true
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/",
  "forge-std/=node_modules/forge-std/src/",
  "dark-contracts/=lib/dark-contracts/",
]

[invariant]
runs = 32
depth = 32
fail_on_revert = true
